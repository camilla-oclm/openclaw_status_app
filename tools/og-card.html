<!doctype html>
<meta charset="utf-8">
<title>ClawStat.us share card</title>
<!--
  The social image (web/og.png, 1200×630) is this page, screenshotted:

    node tools/shot.cjs tools/og-card.html web/og.png --size 1200x630

  It uses the page's own fonts and mark (served from web/ by the screenshot tool), so the
  card follows the design system instead of drifting from it. Re-run after a brand change.
-->
<style>
@font-face{font-family:"Inter";font-style:normal;font-weight:400 800;src:url(fonts/Inter-var.woff2) format("woff2")}
@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:300 700;src:url(fonts/SpaceGrotesk-var.woff2) format("woff2")}
:root{
  --bg:#070a0f; --card:#10151d; --text:#e7ebf1; --muted:#9aa5b6; --faint:#8a94a4;
  --accent:#3fe0d5; --accent2:#8f9ff5; --good:#5ad893; --warn:#f0c052; --bad:#f6788c;
}
*{margin:0; box-sizing:border-box}
html,body{width:1200px; height:630px; overflow:hidden}
body{
  position:relative; background:var(--bg); color:var(--text);
  font-family:Inter,system-ui,sans-serif; font-optical-sizing:auto; -webkit-font-smoothing:antialiased;
}
body::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(48% 60% at 12% -8%, color-mix(in srgb,var(--warn) 22%,transparent), transparent 72%),
             radial-gradient(40% 48% at 96% 4%, color-mix(in srgb,var(--accent2) 16%,transparent), transparent 72%),
             radial-gradient(56% 40% at 60% 120%, color-mix(in srgb,var(--accent) 12%,transparent), transparent 72%)}
body::before{content:""; position:absolute; inset:0; pointer-events:none;
  background-image:radial-gradient(color-mix(in srgb,var(--text) 9%,transparent) 1px,transparent 1.4px); background-size:26px 26px;
  -webkit-mask-image:radial-gradient(70% 70% at 50% 0%,#000 10%,transparent 100%); mask-image:radial-gradient(70% 70% at 50% 0%,#000 10%,transparent 100%)}
.card{position:relative; z-index:1; height:100%; padding:64px 80px 56px; display:flex; flex-direction:column}
.brand{display:flex; align-items:center; gap:18px}
.brand img{width:56px; height:56px; display:block; border-radius:14px; box-shadow:0 12px 30px -12px rgba(63,224,213,.55)}
.wm{font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:34px; letter-spacing:-.02em}
.wm .dot{color:var(--accent)}
.q{margin-top:auto; font-family:"Space Grotesk",sans-serif; font-weight:700; font-size:98px; line-height:.98; letter-spacing:-.045em; text-wrap:balance; max-width:13.5ch}
.q .oc{background:linear-gradient(94deg,var(--accent),color-mix(in srgb,#fff 38%,var(--accent))); -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:.06em}
.sub{margin-top:26px; font-size:26px; line-height:1.45; color:var(--muted); max-width:30ch}
.foot{margin-top:auto; display:flex; align-items:center; gap:28px; font-size:19px; color:var(--faint)}
.words{display:flex; align-items:center; gap:14px}
.w{display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:19px}
.w svg{width:22px; height:22px; flex:none}
.w.good{color:var(--good)} .w.warn{color:var(--warn)} .w.bad{color:var(--bad)}
.foot .url{margin-left:auto; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--accent); font-weight:600; font-size:22px}
</style>
<div class="card">
  <div class="brand">
    <img src="/logo.svg" alt="">
    <span class="wm">ClawStat<span class="dot">.</span>us</span>
  </div>
  <h1 class="q">Should you update <span class="oc">OpenClaw</span>?</h1>
  <p class="sub">A live verdict for the latest release: post-release bugs scouted and scored, two independent models argue it out.</p>
  <div class="foot">
    <span class="words">
      <span class="w good"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l4.8 4.8L19.5 7"/></svg>Safe to update</span>
      <span class="w warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4L2.8 19.6h18.4L12 4z M12 10v4.2 M12 17.2h.01"/></svg>Update with care</span>
      <span class="w bad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 5.5v13 M15.5 5.5v13"/></svg>Skip this version</span>
    </span>
    <span class="url">clawstat.us</span>
  </div>
</div>
