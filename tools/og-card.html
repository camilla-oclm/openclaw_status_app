<!doctype html>
<meta charset="utf-8">
<title>ClawStat.us share card</title>
<!--
  The social image (web/og.png, 1200×630) is this page, screenshotted:

    node tools/shot.cjs tools/og-card.html web/og.png --size 1200x630

  It uses the page's own fonts and mark (served from web/ by the screenshot tool), so the
  card follows the design system instead of drifting from it. Re-run after a brand change.
  Since 2026-10-30 that is the Plum Comet Labs "Comet" look: deep space, a still comet,
  Unbounded + Space Grotesk, the studio gradient.
-->
<style>
@font-face{font-family:"Unbounded";font-style:normal;font-weight:200 900;src:url(fonts/Unbounded-var.woff2) format("woff2")}
@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:300 700;src:url(fonts/SpaceGrotesk-var.woff2) format("woff2")}
:root{
  --bg:#07060d; --text:#f4f1fb; --muted:#a8a0bd; --faint:#958dab;
  --pink:#ff7eb3; --plum:#c06bff; --good:#5ad893; --warn:#f0c052; --bad:#f6788c;
  --grad:linear-gradient(100deg,#ffd29a 0%,#ff7eb3 30%,#c06bff 60%,#7aa7ff 80%,#ffd29a 100%);
}
*{margin:0; box-sizing:border-box}
html,body{width:1200px; height:630px; overflow:hidden}
body{
  position:relative; background:var(--bg); color:var(--text);
  font-family:"Space Grotesk",system-ui,sans-serif; -webkit-font-smoothing:antialiased;
}
body::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(52% 70% at 92% -6%, rgba(192,107,255,.30), transparent 70%),
             radial-gradient(44% 56% at 4% -10%, rgba(240,192,82,.13), transparent 72%),
             radial-gradient(50% 50% at 0% 110%, rgba(255,126,179,.10), transparent 72%)}
body::before{content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(1.4px 1.4px at 6% 22%, rgba(255,255,255,.8), transparent 70%),
             radial-gradient(1px 1px at 17% 9%, rgba(255,255,255,.55), transparent 70%),
             radial-gradient(1.2px 1.2px at 31% 36%, rgba(255,255,255,.6), transparent 70%),
             radial-gradient(1px 1px at 44% 12%, rgba(255,255,255,.5), transparent 70%),
             radial-gradient(1.6px 1.6px at 56% 28%, rgba(255,246,234,.85), transparent 70%),
             radial-gradient(1px 1px at 63% 7%, rgba(255,255,255,.55), transparent 70%),
             radial-gradient(1.2px 1.2px at 71% 46%, rgba(255,255,255,.6), transparent 70%),
             radial-gradient(1px 1px at 82% 58%, rgba(255,255,255,.5), transparent 70%),
             radial-gradient(1.4px 1.4px at 94% 40%, rgba(255,255,255,.7), transparent 70%),
             radial-gradient(1px 1px at 88% 82%, rgba(255,255,255,.45), transparent 70%),
             radial-gradient(1px 1px at 12% 70%, rgba(255,255,255,.45), transparent 70%),
             radial-gradient(1.2px 1.2px at 38% 88%, rgba(255,255,255,.5), transparent 70%)}
/* the studio's comet, still: a gradient tail and a white-hot head */
.comet{position:absolute; z-index:1; top:96px; right:92px; width:300px; height:14px; transform:rotate(-32deg); transform-origin:100% 50%}
.comet::before{content:""; position:absolute; left:0; right:6px; top:6px; height:2px; border-radius:2px; background:linear-gradient(90deg,transparent,rgba(192,107,255,.45) 45%,#ff7eb3 85%,#ffd29a); box-shadow:0 0 12px rgba(255,126,179,.7)}
.comet::after{content:""; position:absolute; right:0; top:1px; width:12px; height:12px; border-radius:50%; background:#fff6ea; box-shadow:0 0 16px 6px rgba(255,210,154,.8),0 0 46px 16px rgba(255,126,179,.45)}
.card{position:relative; z-index:2; height:100%; padding:64px 80px 56px; display:flex; flex-direction:column}
.brand{display:flex; align-items:center; gap:18px}
.brand img{width:56px; height:56px; display:block; filter:drop-shadow(0 0 16px rgba(255,126,179,.4))}
.wm{font-family:"Unbounded",sans-serif; font-weight:600; font-size:30px; letter-spacing:.005em}
.q{margin-top:auto; font-family:"Unbounded",sans-serif; font-weight:800; font-size:76px; line-height:1.02; letter-spacing:-.04em; text-wrap:balance; max-width:15ch}
.q .oc{background:var(--grad); background-size:150% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:.06em}
.sub{margin-top:24px; font-size:26px; line-height:1.45; color:var(--muted); max-width:32ch}
.foot{margin-top:auto; display:flex; align-items:center; gap:28px; font-size:19px; color:var(--faint)}
.words{display:flex; align-items:center; gap:14px}
.w{display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:19px}
.w svg{width:22px; height:22px; flex:none}
.w.good{color:var(--good)} .w.warn{color:var(--warn)} .w.bad{color:var(--bad)}
.foot .url{margin-left:auto; font-family:"Unbounded",sans-serif; color:var(--pink); font-weight:600; font-size:22px}
</style>
<span class="comet" aria-hidden="true"></span>
<div class="card">
  <div class="brand">
    <img src="/logo.svg" alt="">
    <span class="wm">clawstat.us</span>
  </div>
  <h1 class="q">Should you update <span class="oc">OpenClaw</span>?</h1>
  <p class="sub">A live verdict for the latest release: post-release bugs scouted and scored, two independent models argue it out.</p>
  <div class="foot">
    <span class="words">
      <span class="w good"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l4.8 4.8L19.5 7"/></svg>Safe to update</span>
      <span class="w warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4L2.8 19.6h18.4L12 4z M12 10v4.2 M12 17.2h.01"/></svg>Update with care</span>
      <span class="w bad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 5.5v13 M15.5 5.5v13"/></svg>Skip this version</span>
    </span>
    <span class="url">clawstat.us</span>
  </div>
</div>
