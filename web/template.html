<style>
/* ═══════════════════════════════════════════════════════════════════════════
   ClawStat.us — "Signal" design system (v1.2)
   Zero-dependency, dark/light, mobile-first. Inlined into template.html on ship.
   Layout: a floating glass header → a two-column answer (status word + platform
   matrix) on an open, verdict-tinted mesh canvas → a bento row (best version /
   why) → the evidence behind one toggle. Every class/id the client JS and the
   browser suites address is unchanged; this file only decides how they look.
   ═══════════════════════════════════════════════════════════════════════════ */

/* Self-hosted fonts — no runtime CDN: the woff2 files ship next to the page
   (web/fonts/, OFL texts beside them), so the page stays offline/file:///CSP-safe.
   Text: Inter (variable, wght 400–800 + optical size, latin + core latin-ext, 63 KB).
   Display: Space Grotesk (variable, latin, 22 KB) — the status word, versions, titles.
   "Inter Fallback" is Arial (or a metric clone) re-proportioned to Inter with the
   size-adjust / ascent / descent overrides, so the swap from the fallback to the
   web font moves nothing on screen. */
@font-face{
  font-family:"Inter";
  font-style:normal; font-weight:400 800; font-display:swap;
  src:url(fonts/Inter-var.woff2) format("woff2");
}
@font-face{
  font-family:"Inter Fallback";
  src:local("Arial"), local("Liberation Sans"), local("Helvetica Neue"), local("Helvetica");
  size-adjust:107.4%; ascent-override:90.2%; descent-override:22.5%; line-gap-override:0%;
}
@font-face{
  font-family:"Space Grotesk";
  font-style:normal; font-weight:300 700; font-display:swap;
  src:url(fonts/SpaceGrotesk-var.woff2) format("woff2");
}

:root{
  /* palette — dark: a deep blue-black canvas; depth comes from the mesh glow,
     translucent glass surfaces and hairline borders, not from heavy strokes */
  --bg:#070a0f; --bg-elev:#0c1017;
  --card:#10151d; --card2:#151b25; --card3:#1b222e;
  --glass:rgba(16,21,29,.66);
  --border:color-mix(in srgb,#a8b8d0 10%,transparent);
  --border2:color-mix(in srgb,#a8b8d0 18%,transparent);
  --border-soft:color-mix(in srgb,#a8b8d0 7%,transparent);   /* tiles: tone lives in the glyph + bar */
  --hi:color-mix(in srgb,#fff 9%,transparent);          /* top-edge highlight on glass */
  --text:#e7ebf1; --muted:#9aa5b6; --faint:#8a94a4;  /* faint ≥4.5:1 on bg+card (AA small text) */
  --on-accent:#06171b;
  --accent:#3fe0d5; --accent2:#8f9ff5;
  --good:#5ad893; --warn:#f0c052; --orange:#f39a5d; --bad:#f6788c; --info:#8cabf1; --gray:#8f98a7;
  --word-mix:#fff; --word-tail:38%;                   /* the status word's gradient tail */
  /* tone tints/borders are recipes over the per-theme status colors */
  --good-bg:color-mix(in srgb,var(--good) 11%,transparent); --warn-bg:color-mix(in srgb,var(--warn) 11%,transparent);
  --bad-bg:color-mix(in srgb,var(--bad) 11%,transparent); --info-bg:color-mix(in srgb,var(--info) 11%,transparent);
  --gray-bg:color-mix(in srgb,var(--gray) 11%,transparent);
  --good-bd:color-mix(in srgb,var(--good) 32%,transparent); --warn-bd:color-mix(in srgb,var(--warn) 32%,transparent);
  --bad-bd:color-mix(in srgb,var(--bad) 32%,transparent); --info-bd:color-mix(in srgb,var(--info) 32%,transparent);
  --gray-bd:color-mix(in srgb,var(--gray) 28%,transparent);
  --mesh-a:22%; --mesh-b:14%; --mesh-c:9%; --dots:8%;

  /* type — a text face, a display face, a mono for identifiers; a six-step text
     scale (2xs…lg) plus display clamps; line-height by role */
  --text-face:"Inter","Inter Fallback",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --display-face:"Space Grotesk",var(--text-face);
  --sans:var(--text-face); --display:var(--display-face);
  --mono:ui-monospace,"SFMono-Regular","SF Mono",Menlo,"JetBrains Mono",Consolas,monospace;
  --fs-2xs:.72rem; --fs-xs:.8rem; --fs-sm:.875rem; --fs-base:.95rem; --fs-md:1.05rem; --fs-lg:1.4rem;
  --fs-xl:clamp(1.5rem,1.15rem + 1.5vw,1.95rem); --fs-2xl:clamp(2rem,1.4rem + 2.9vw,3rem);
  --fs-hero:clamp(2.4rem,1.35rem + 3.9vw,4.4rem);
  --lh-display:1.12; --lh-body:1.55; --lh-ui:1.4;

  /* spacing rhythm */
  --sp-1:.5rem; --sp-2:.75rem; --sp-3:1rem; --sp-4:1.5rem; --sp-5:2.25rem; --sp-6:3.25rem;

  /* radius / shadow / motion */
  --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:26px; --r-pill:999px;
  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 1px 2px rgba(0,0,0,.3),0 14px 34px -18px rgba(0,0,0,.55);
  --shadow-3:0 1px 2px rgba(0,0,0,.35),0 40px 90px -40px rgba(0,0,0,.7);
  --sheen:linear-gradient(180deg,color-mix(in srgb,#fff 2.5%,var(--card)),var(--card));
  /* motion — one standard ease, an out-quint for settles, a spring for lifts (a linear()
     curve where supported, see @supports below), durations by size */
  --ease:cubic-bezier(.4,.14,.3,1);
  --ease-out-quint:cubic-bezier(.22,1,.36,1);
  --ease-spring:var(--ease-out-quint);
  --dur-1:120ms; --dur-2:200ms; --dur-3:420ms;
  /* focus ring */
  --ring:var(--accent); --ring-w:2px; --ring-off:2px;
  --maxw:1180px;
}
@supports (transition-timing-function:linear(0,1)){
  :root{--ease-spring:linear(0,.006,.025 2.8%,.101 6.1%,.539 18.9%,.721 25.3%,.849 31.5%,.937 38.1%,.968 41.8%,.991 45.7%,1.006 50.1%,1.015 55.2%,1.017 61.3%,1.001 89.2%,1)}
}
/* the stat numerals count up: a registered integer property the browser can interpolate */
@property --n{syntax:"<integer>"; inherits:false; initial-value:0}
html[data-theme="light"]{
  /* light — cool paper: white glass on a soft blue-gray canvas */
  --bg:#f3f5f9; --bg-elev:#eaeef4;
  --card:#ffffff; --card2:#f6f8fb; --card3:#edf0f5;
  --glass:rgba(255,255,255,.8);
  --border:color-mix(in srgb,#42506a 12%,transparent);
  --border2:color-mix(in srgb,#42506a 20%,transparent);
  --border-soft:color-mix(in srgb,#42506a 9%,transparent);
  --hi:color-mix(in srgb,#fff 70%,transparent);
  --text:#161b23; --muted:#596272; --faint:#646d7b;
  --on-accent:#ffffff;
  --accent:#0a686f; --accent2:#4759ae;
  --good:#197245; --warn:#7b5f1c; --orange:#9f4c1b; --bad:#b13643; --info:#385fbc; --gray:#60646c;
  --word-mix:#000; --word-tail:16%;
  --mesh-a:12%; --mesh-b:8%; --mesh-c:5%; --dots:8%;
  --shadow-1:0 1px 2px rgba(28,44,78,.07);
  --shadow-2:0 1px 2px rgba(28,44,78,.06),0 14px 34px -20px rgba(28,44,78,.22);
  --shadow-3:0 1px 2px rgba(28,44,78,.07),0 36px 80px -40px rgba(28,44,78,.28);
  --sheen:linear-gradient(180deg,#fff,#fff);
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth; scroll-padding-top:84px}
body{
  font-family:var(--sans); font-optical-sizing:auto;
  background:var(--bg); color:var(--text);
  line-height:var(--lh-body); font-size:16px; min-height:100vh;
  position:relative; overflow-x:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
/* numerals that sit in columns or get compared line to line */
.hero-sub,.stat .v,.inum,.tr-runs,.tr-dates,.tld,.cu-date,.vc-n,.tab .cnt,.sec-count,.reco-chips,.tc-legend,.plat .pl{font-variant-numeric:tabular-nums}
/* backdrop — two fixed layers behind everything:
   ::after  a verdict-tinted mesh (three soft radial blobs; JS sets body[data-tone],
            an isolated attr + dedicated --pglow var — deliberately NOT a .tone-*
            class, which would leak into the component tone cascade)
   ::before a faint dot grid that fades out below the fold                       */
body::after{
  content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(50% 42% at 16% -6%, color-mix(in srgb,var(--pglow,var(--accent)) var(--mesh-a),transparent), transparent 72%),
    radial-gradient(38% 34% at 94% 6%,  color-mix(in srgb,var(--accent2) var(--mesh-b),transparent), transparent 72%),
    radial-gradient(56% 40% at 62% 112%, color-mix(in srgb,var(--accent) var(--mesh-c),transparent), transparent 72%);
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background-image:radial-gradient(color-mix(in srgb,var(--text) var(--dots),transparent) 1px,transparent 1.4px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(70% 60% at 50% 0%,#000 10%,transparent 100%);
          mask-image:radial-gradient(70% 60% at 50% 0%,#000 10%,transparent 100%);
}
body[data-tone="good"]{--pglow:var(--good)}
body[data-tone="warn"]{--pglow:var(--warn)}
body[data-tone="bad"]{--pglow:var(--bad)}
body[data-tone="info"]{--pglow:var(--info)}
body[data-tone="muted"]{--pglow:var(--gray)}

.tone-good{--tone:var(--good);--tone-bg:var(--good-bg);--tone-bd:var(--good-bd)}
.tone-warn{--tone:var(--warn);--tone-bg:var(--warn-bg);--tone-bd:var(--warn-bd)}
.tone-bad{--tone:var(--bad);--tone-bg:var(--bad-bg);--tone-bd:var(--bad-bd)}
.tone-info{--tone:var(--info);--tone-bg:var(--info-bg);--tone-bd:var(--info-bd)}
.tone-muted{--tone:var(--gray);--tone-bg:var(--gray-bg);--tone-bd:var(--gray-bd)}

/* ── glass surface recipe (shared by the header, setup card, toggle) ───────── */
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:saturate(160%) blur(18px); backdrop-filter:saturate(160%) blur(18px);
  border:1px solid var(--border2);
  box-shadow:inset 0 1px 0 var(--hi), var(--shadow-2);
}

/* ── floating header ───────────────────────────────────────────────────────── */
.topbar{
  position:sticky; top:.7rem; z-index:30;
  width:min(100% - 1.5rem, calc(var(--maxw) + 2rem));
  margin:.7rem auto 0;
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  padding:.45rem .6rem .45rem .7rem;
  border-radius:var(--r-pill);
}
.brand{display:flex; align-items:center; gap:.55rem; font-weight:800; font-size:var(--fs-md); letter-spacing:-.02em; text-decoration:none; color:inherit}
.brand .logo{
  width:32px; height:32px; display:grid; place-items:center; color:var(--on-accent);
  border-radius:50%; background:linear-gradient(140deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--accent2)));
  box-shadow:0 6px 16px -6px color-mix(in srgb,var(--accent) 70%,transparent);
}
html[data-theme="light"] .brand .logo{color:#fff}
.brand .logo svg{display:block}
.brand .wm{font-family:var(--display)}
.brand .wm .dot{color:var(--accent)}
.topnav{display:flex; align-items:center; gap:.15rem}
.topnav a{
  padding:.38rem .85rem; border-radius:var(--r-pill); text-decoration:none;
  font-size:var(--fs-sm); font-weight:600; color:var(--muted); transition:color var(--dur-2) var(--ease-out-quint), background-color var(--dur-2) var(--ease-out-quint);
}
.topnav a:hover{color:var(--text); background:var(--card3)}
.topnav a.on{color:var(--text); background:var(--card3); box-shadow:inset 0 0 0 1px var(--border)}
.bar-right{display:flex; align-items:center; gap:.5rem}
.icon-btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:36px; height:36px; border-radius:50%; cursor:pointer;
  background:transparent; border:1px solid var(--border); color:var(--text);
  font-size:var(--fs-md); transition:background-color var(--dur-2) var(--ease-out-quint), border-color var(--dur-2) var(--ease-out-quint), transform var(--dur-3) var(--ease-spring);
}
.icon-btn:hover{background:var(--card3); border-color:var(--border2); transform:rotate(15deg)}
.icon-btn:active{transform:rotate(15deg) scale(.94); transition-duration:var(--dur-1)}

.wrap{max-width:calc(var(--maxw) + 4rem); margin:0 auto; padding:clamp(1.4rem,3.5vw,2.6rem) clamp(1rem,4vw,2rem) 5rem}

/* ── page grid: the answer, then a bento row, then everything else ─────────── */
#app{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:var(--sp-4); align-items:stretch}
#app > *{grid-column:1/-1; min-width:0}
#app > .section{margin-top:0}
@media(min-width:1000px){
  #app > .reco{grid-column:1/6; margin-top:0}
  #app > #why{grid-column:6/-1; display:flex; flex-direction:column}
  #app > #why .why-grid{flex:1; grid-template-columns:1fr; grid-template-rows:1fr 1fr}
}
#app:focus{outline:none}

/* ── hero / the answer ─────────────────────────────────────────────────────── */
.hero{
  display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr);
  gap:clamp(1.6rem,4vw,3.6rem); align-items:start;
  padding:clamp(.6rem,2.5vw,2rem) 0 clamp(1.2rem,3vw,2.4rem);
}
@media(max-width:960px){ .hero{grid-template-columns:1fr; gap:1.4rem} }
.hero-main{min-width:0; padding-top:.35rem}
.eyebrow{
  display:inline-flex; align-items:center; gap:.55rem;
  font-family:var(--mono); font-size:var(--fs-2xs); letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); font-weight:600;
}
.eyebrow::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--tone); box-shadow:0 0 0 0 var(--tone); animation:pulse 2.6s var(--ease) infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--tone) 60%,transparent)}
  70%{box-shadow:0 0 0 9px transparent}
  100%{box-shadow:0 0 0 0 transparent}
}
.hero-version{font-family:var(--display); font-size:clamp(1.55rem,1.15rem + 1.6vw,2.3rem); font-weight:700; margin:.6rem 0 0; letter-spacing:-.03em; line-height:var(--lh-display); text-wrap:balance}
.hero-version .vnum{font-family:var(--mono); color:var(--tone); font-weight:700; letter-spacing:-.02em}
.hero-sub{color:var(--muted); font-size:var(--fs-sm); margin-top:.5rem}
.hero-sub .sep{opacity:.45; margin:0 .45rem}

/* the status word — the biggest thing on the page */
.verdict{
  display:flex; align-items:center; gap:clamp(.7rem,1.6vw,1.1rem); margin-top:1.6rem;
  color:var(--tone); text-decoration:none; max-width:100%;
}
.verdict .em{
  flex:none; display:grid; place-items:center; color:var(--tone);
  width:clamp(52px,3rem + 2.4vw,76px); aspect-ratio:1; border-radius:24%;
  font-size:clamp(1.55rem,1rem + 1.6vw,2.3rem); line-height:1;
  background:linear-gradient(150deg,color-mix(in srgb,var(--tone) 24%,var(--card)),color-mix(in srgb,var(--tone) 8%,var(--card)));
  border:1px solid var(--tone-bd);
  box-shadow:0 0 0 6px color-mix(in srgb,var(--tone) 8%,transparent), 0 24px 50px -22px color-mix(in srgb,var(--tone) 70%,transparent);
}
.verdict .answer-word{
  font-family:var(--display); font-size:var(--fs-hero); font-weight:700; letter-spacing:-.045em; line-height:1;
  background:linear-gradient(94deg,var(--tone) 0%,color-mix(in srgb,var(--word-mix) var(--word-tail),var(--tone)) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  padding-bottom:.06em;   /* keep descenders inside the clipped box */
  text-wrap:balance;
}
a.verdict{cursor:pointer}
a.verdict .answer-word{transition:filter .18s var(--ease)}
a.verdict:hover .answer-word{filter:brightness(1.12)}
.verdict .v-ext{font-size:var(--fs-sm); color:var(--muted); align-self:flex-start; margin-top:.2rem; opacity:.8}
a.verdict:hover .v-ext{color:var(--tone); opacity:1}
.answer-line{margin-top:1.3rem; font-size:clamp(1rem,.95rem + .3vw,1.12rem); color:var(--text); max-width:62ch; line-height:1.6}
.hero-headline{margin-top:.85rem; color:var(--muted); font-size:var(--fs-sm); max-width:66ch; line-height:1.55; padding-left:.85rem; border-left:2px solid var(--border2)}
.hero-headline .hh-k{font-size:var(--fs-xs); color:var(--faint); font-weight:600; margin-right:.35rem}
.hero .banner{margin:1rem 0 0}
.banner .bi{display:inline-flex; color:var(--warn)}
/* the meta line: confidence · evidence gate · second-model review · pre-release —
   one quiet line of text items (the class names are the browser suites' contract) */
.conf-row{display:flex; flex-wrap:wrap; gap:.3rem 0; margin:1.35rem 0 0 -.95rem; padding:3px 0; overflow:hidden; align-items:center; font-size:var(--fs-sm); color:var(--muted)}

/* ── unified pill recipe ────────────────────────────────────────────────
   Every chip/tag/badge species shares one base and tunes it via --p-*
   custom properties; selected state is ONE convention (accent tint on
   aria-pressed/aria-selected). */
.chip,.fbtn,.pick,.vchip,.tag,.pbadge,.tr-badge,.sec-count{
  display:inline-flex; align-items:center; gap:.4rem;
  font-family:inherit; font-size:var(--p-fs,var(--fs-xs)); font-weight:var(--p-fw,600); line-height:1.4;
  padding:var(--p-pad,.34rem .8rem); border-radius:var(--r-pill);
  background:var(--p-bg,var(--card2)); color:var(--p-fg,var(--muted));
  border:1px solid var(--p-bd,var(--border));
}
.fbtn,.pick,button.chip{cursor:pointer; transition:color var(--dur-2) var(--ease-out-quint), background-color var(--dur-2) var(--ease-out-quint), border-color var(--dur-2) var(--ease-out-quint), box-shadow var(--dur-2) var(--ease-out-quint), transform var(--dur-2) var(--ease-spring)}
/* press: compact controls scale down for one short beat */
.fbtn:active,.pick:active,button.chip:active,.ltab:active,.tab:active,.icon-btn:active,.ki-more:active,.cu-select:active{transform:scale(.96); transition-duration:var(--dur-1)}
.fbtn:hover,.pick:hover{--p-fg:var(--text); --p-bd:var(--border2)}
.fbtn[aria-pressed="true"],.pick[aria-pressed="true"]{
  --p-bg:color-mix(in srgb,var(--accent) 15%,transparent);
  --p-fg:var(--accent);
  --p-bd:color-mix(in srgb,var(--accent) 40%,transparent);
  --p-fw:700;
}
.fcomp[aria-pressed="true"]{
  --p-bg:color-mix(in srgb,var(--accent2) 15%,transparent);
  --p-fg:var(--accent2);
  --p-bd:color-mix(in srgb,var(--accent2) 40%,transparent);
}
.chip b{color:var(--text); font-weight:700}
.chip.lvl-high{--p-fg:var(--good); --p-bd:var(--good-bd); --p-bg:var(--good-bg)}
.chip.lvl-medium{--p-fg:var(--warn); --p-bd:var(--warn-bd); --p-bg:var(--warn-bg)}
.chip.lvl-low{--p-fg:var(--bad); --p-bd:var(--bad-bd); --p-bg:var(--bad-bg)}
a.chip{text-decoration:none; cursor:pointer}
a.chip:hover{--p-bd:var(--accent); --p-fg:var(--text)}
.chip .v-ext{font-size:var(--fs-xs); opacity:.7; margin-left:.1rem}
.conf-row .chip{--p-bg:transparent; --p-bd:transparent; --p-pad:0 .95rem; --p-fs:var(--fs-sm); --p-fw:500; --p-fg:var(--muted); gap:.35rem; border-radius:var(--r-xs); position:relative; margin-left:-3px}
.conf-row .chip b{font-weight:600; display:inline-flex; align-items:center; gap:.3rem}
.conf-row .chip.lvl-high b{color:var(--good)} .conf-row .chip.lvl-medium b{color:var(--warn)} .conf-row .chip.lvl-low b{color:var(--bad)}
/* the dot separator sits on each item's left edge; the row's negative margin + overflow
   clip swallow the dot of whichever item starts a line, so a wrapped line never leads
   with one (the 3px negative item margin is the dot's own width) */
.conf-row .chip::before{content:""; position:absolute; left:-1px; top:50%; width:3px; height:3px; margin-top:-1.5px; border-radius:50%; background:var(--faint); opacity:.8}   /* -1px: the pill's own border */
.conf-row .chip:hover{--p-bd:transparent; --p-fg:var(--text)}
.conf-row a.chip:hover b, .conf-row button.chip:hover b{color:var(--text)}

/* ── ⚖︎ chip → second-model review expander ─────────────────────────────── */
button.chip:hover{--p-bd:var(--accent); --p-fg:var(--text)}
.chip .cx{font-size:.58rem; color:var(--muted); transition:transform .15s var(--ease); display:inline-block}
.chip[aria-expanded="true"] .cx{transform:rotate(180deg)}
.rev-detail{margin-top:.9rem; max-width:64ch; background:var(--card); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:var(--r-md); padding:1rem 1.15rem; font-size:var(--fs-sm); text-align:left; box-shadow:var(--shadow-1)}
.rev-detail .rvd-h{font-size:var(--fs-xs); font-weight:700; color:var(--accent); margin-bottom:.5rem}
.rev-detail .rvd-status{color:var(--text)}
.rev-detail .rvd-quote{border-left:2px solid var(--border2); margin:.6rem 0; padding:.1rem 0 .1rem .75rem; color:var(--muted); font-style:italic}
.rev-detail .rvd-k{font-weight:700; font-size:var(--fs-xs); margin-top:.7rem; color:var(--text)}
.rev-detail .rvd-list{list-style:none; margin-top:.35rem; display:flex; flex-direction:column; gap:.3rem}
.rev-detail .rvd-list li{position:relative; padding-left:1rem; color:var(--muted)}
.rev-detail .rvd-list li::before{content:"›"; position:absolute; left:0; color:var(--accent)}
.rev-detail .rvd-note{margin-top:.7rem; font-size:var(--fs-xs); color:var(--faint)}

/* inline icon svg — aligns in both flex pills (gap does spacing) and text flow */
.ic-svg{flex:none; vertical-align:-.12em}
/* verdict glyphs — the page's own marks for ✅ ⚠️ ⏸️ ⏳, drawn beside the visually
   hidden emoji (the data key). They size from the font-size of whatever holds them
   and take the surrounding tone through currentColor. */
.vg{flex:none; display:inline-block; width:1em; height:1em; vertical-align:-.15em}
.verdict .em .vg{width:.92em; height:.92em}
.vgw{display:inline-flex; align-items:center; color:var(--tone)}
.imp-none{--ic:var(--good)} .imp-low{--ic:var(--info)} .imp-medium{--ic:var(--warn)} .imp-high{--ic:var(--bad)}
.sv-critical{--ic:var(--bad)} .sv-high{--ic:var(--orange)} .sv-medium{--ic:var(--warn)} .sv-low{--ic:var(--gray)} .sv-none{--ic:var(--good)}

/* ── low-confidence banner ─────────────────────────────────────────────── */
.banner{
  display:flex; gap:.7rem; align-items:flex-start; margin-bottom:1.1rem;
  padding:.9rem 1.05rem; border-radius:var(--r-md);
  background:var(--warn-bg); border:1px solid var(--warn-bd); color:var(--text); font-size:var(--fs-base);
}
.banner .bi{font-size:var(--fs-md); line-height:1.3}

/* ── your setup: the platform matrix (lives in the hero's right column) ──── */
.hero .setup{
  border-radius:var(--r-xl); padding:1.2rem 1.2rem 1.1rem; position:relative; overflow:hidden;
}
.hero .setup::before{   /* soft accent bloom in the card's corner */
  content:""; position:absolute; inset:-40% -30% auto auto; width:60%; aspect-ratio:1; pointer-events:none;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 12%,transparent),transparent);
}
.setup-head{display:flex; align-items:baseline; gap:.6rem; flex-wrap:wrap; margin-bottom:.3rem; position:relative}
.setup-head .sec-title{font-size:var(--fs-md); text-wrap:nowrap}
.setup .sec-note{margin-left:auto; font-size:var(--fs-xs); color:var(--muted)}
@media(max-width:600px){ .setup-head .sec-note{flex-basis:100%; margin-left:0} }
.setup-intro{font-size:var(--fs-xs); color:var(--muted); margin:0 0 .85rem; line-height:1.5; max-width:60ch; position:relative}
.setup .chips{display:grid; grid-template-columns:repeat(auto-fill,minmax(122px,1fr)); gap:.4rem; margin-bottom:.75rem; position:relative}
.setup .chip-grp{grid-column:1/-1; font-family:var(--mono); font-size:var(--fs-2xs); font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); margin:.2rem 0 .05rem}
.setup .chips .pick{
  --p-pad:0; --p-fs:var(--fs-xs); --p-fw:600; --p-fg:var(--text); --p-bg:var(--card); --p-bd:var(--border-soft);
  border-radius:var(--r-sm); padding:.5rem .6rem .5rem .75rem; min-height:40px; min-width:0;
  justify-content:flex-start; gap:.45rem; text-align:left;
  box-shadow:inset 2px 0 0 var(--tk,transparent);
}
.setup .chips .pick .pk{min-width:0; line-height:1.15; overflow-wrap:anywhere}
.setup .chips .pick .pv{margin-left:auto; font-size:.95em; line-height:1; flex:none; display:inline-flex; color:var(--tk,var(--muted))}
.pick.pv-good{--tk:var(--good)} .pick.pv-warn{--tk:var(--warn)} .pick.pv-bad{--tk:var(--bad)}
.setup .chips .pick:hover{--p-bd:var(--border2); --p-bg:var(--card2); transform:translateY(-1px); box-shadow:inset 2px 0 0 var(--tk,transparent), var(--shadow-1)}
.setup .chips .pick[data-k][aria-pressed="true"]{
  --p-bg:color-mix(in srgb,var(--accent) 14%,var(--card)); --p-fg:var(--text);
  --p-bd:color-mix(in srgb,var(--accent) 55%,transparent); --p-fw:700;
  box-shadow:inset 2px 0 0 var(--tk,var(--accent)), 0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);
}
.setup .chips .pick.pick-more,.setup .chips .pick.pick-clear,.setup .chips .pick.pick-share{
  --p-bg:transparent; --p-fg:var(--faint); border-style:dashed; justify-content:center; box-shadow:none; text-align:center;
}
.setup .chips .pick.pick-more:hover,.setup .chips .pick.pick-clear:hover,.setup .chips .pick.pick-share:hover{box-shadow:none}
.pick-more[aria-expanded="true"]{--p-fg:var(--text)}
.setup .chips .pick.pick-clear:hover{--p-fg:var(--bad); --p-bd:var(--bad-bd)}
.setup .chips .pick.pick-share:hover{--p-fg:var(--accent); --p-bd:color-mix(in srgb,var(--accent) 40%,transparent)}
.comp-chips{margin-top:-.2rem}
.comp-chips[hidden]{display:none}
.setup .hint{color:var(--faint); font-size:var(--fs-xs); margin-top:.1rem; position:relative}
.setup .risk{position:relative; padding:.9rem 1rem; border-radius:var(--r-md); font-size:var(--fs-sm); color:var(--text); background:var(--tone-bg); border:1px solid var(--tone-bd)}
.setup .risk .rh{font-weight:600; margin-bottom:.2rem; line-height:1.5}
.setup .risk .sv{display:flex; align-items:center; flex-wrap:wrap; gap:.5rem; margin-bottom:.65rem; padding-bottom:.65rem; border-bottom:1px solid var(--tone-bd)}
.sv .sv-k{font-size:var(--fs-xs); color:var(--faint); font-weight:600}
.sv .sv-em{font-size:var(--fs-lg); line-height:1; display:inline-flex; color:var(--tone)}
.sv .sv-l{font-family:var(--display); font-weight:700; color:var(--tone); font-size:var(--fs-md); letter-spacing:-.01em}
.sv .sv-note{font-size:var(--fs-2xs); color:var(--muted); font-weight:600}
.risk .prow-list{margin-top:.8rem; display:flex; flex-direction:column; gap:.4rem}
.risk .prow{display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; font-size:var(--fs-xs)}
.risk .ppn{font-weight:700; min-width:6.5rem; display:inline-flex; align-items:center; gap:.4rem}
.pbadge{flex:none; --p-fs:var(--fs-2xs); --p-fw:700; --p-pad:.1rem .5rem; --p-bg:transparent; --p-bd:var(--ic); --p-fg:var(--ic); gap:.3rem}
.risk .pdetail{color:var(--muted); font-size:var(--fs-xs)}
.risk .pdetail.muted2{color:var(--faint); font-style:italic}
.risk .prow-all{margin-top:.5rem; padding-top:.6rem; border-top:1px dashed var(--tone-bd)}
.risk .ccnote{color:var(--faint); font-style:italic}

/* ── best version to run today (bento, left) ───────────────────────────── */
.reco{
  position:relative; overflow:hidden; margin:0;
  padding:1.35rem 1.4rem 1.3rem; border-radius:var(--r-lg);
  background:linear-gradient(150deg,color-mix(in srgb,var(--tone) 16%,var(--card)) 0%,var(--card) 62%);
  border:1px solid var(--tone-bd); box-shadow:inset 0 1px 0 var(--hi), var(--shadow-2);
  transition:transform var(--dur-3) var(--ease-spring), box-shadow var(--dur-3) var(--ease-out-quint);
}
.reco:hover{transform:translateY(-2px); box-shadow:inset 0 1px 0 var(--hi), var(--shadow-3)}
.reco::after{content:""; position:absolute; right:-18%; top:-30%; width:52%; aspect-ratio:1; border-radius:50%; pointer-events:none;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--tone) 18%,transparent),transparent)}
.reco > *{position:relative}
.reco-k{font-family:var(--mono); font-size:var(--fs-2xs); letter-spacing:.14em; text-transform:uppercase; color:var(--tone); font-weight:700; display:inline-flex; align-items:center; gap:.5rem}
.reco-k::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--tone)}
.reco-v{font-family:var(--display); font-size:clamp(1.9rem,1.4rem + 1.6vw,2.6rem); font-weight:700; letter-spacing:-.035em; line-height:1.05; margin-top:.55rem; color:var(--text); text-wrap:balance}
.reco-chips .chip b{display:inline-flex; align-items:center; gap:.3rem}
.reco-why{margin-top:.65rem; color:var(--text); max-width:62ch; font-size:var(--fs-base); line-height:1.55}
.reco-chips{display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.85rem}
.reco-chips .chip{--p-bg:color-mix(in srgb,var(--card) 60%,transparent)}
.reco-chips .chip.pv-good{--p-fg:var(--good); --p-bd:var(--good-bd); --p-bg:var(--good-bg)}
.reco-chips .chip.pv-warn{--p-fg:var(--warn); --p-bd:var(--warn-bd); --p-bg:var(--warn-bg)}
.reco-chips .chip.pv-bad{--p-fg:var(--bad); --p-bd:var(--bad-bd); --p-bg:var(--bad-bg)}
.reco-chips .chip.pv-good b,.reco-chips .chip.pv-warn b,.reco-chips .chip.pv-bad b{color:inherit}
.reco-kk{margin-top:1rem; font-size:var(--fs-xs); color:var(--muted); font-weight:600}
.reco-issues{list-style:none; margin-top:.4rem; display:flex; flex-direction:column; gap:.3rem; font-size:var(--fs-sm); color:var(--text)}
.reco-issues li{overflow-wrap:anywhere}
.reco-cmdrow{display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; margin-top:1rem}
.reco-cmdrow .cmd-k{font-size:var(--fs-xs); color:var(--muted); font-weight:600}
.reco-cmd{font-family:var(--mono); font-size:var(--fs-sm); background:var(--bg-elev); border:1px solid var(--border2); border-radius:var(--r-sm); padding:.45rem .75rem; color:var(--text); overflow-wrap:anywhere; box-shadow:inset 0 1px 0 var(--hi)}
.pick.pick-copy{--p-bg:var(--card2); --p-fg:var(--text); --p-pad:.4rem .8rem}
.pick.pick-copy:hover{--p-bd:var(--accent); --p-fg:var(--accent)}
.reco-link{display:inline-block; margin-top:.7rem; font-size:var(--fs-sm); font-weight:600; color:var(--accent); text-decoration:none}
.reco-link:hover{text-decoration:underline}
.reco-note{margin-top:.8rem; font-size:var(--fs-xs); color:var(--faint); line-height:1.5}

/* ── sections ──────────────────────────────────────────────────────────── */
.section{margin-top:var(--sp-6)}
.reveal{opacity:0; transform:translateY(8px); transition:opacity .45s var(--ease-out-quint), transform .45s var(--ease-out-quint)}
.reveal.in{opacity:1; transform:none}
/* scroll cascade — the items of a [data-stagger] container (tiles, cards, rows, list items,
   paragraphs) arrive one by one as they scroll into view; the observer sets --d per item
   (40 ms steps, capped). `backwards` fill: the end state is the element's own, so hover
   lifts keep working after the entrance. Meters fill when their own card appears. */
[data-stagger] > :not(.in){opacity:0}
[data-stagger] > .in{animation:rise .55s var(--ease-out-quint) backwards; animation-delay:var(--d,0ms)}
html.no-io .reveal, html.no-io [data-stagger] > *{opacity:1 !important; transform:none !important; animation:none !important}
.sec-head{display:flex; align-items:baseline; gap:.65rem; margin-bottom:var(--sp-3); position:relative; flex-wrap:wrap}
.sec-title{font-family:var(--display); font-size:var(--fs-lg); font-weight:700; letter-spacing:-.025em; line-height:var(--lh-display); text-wrap:balance}
.sec-count{font-family:var(--mono); --p-fg:var(--accent); --p-fw:700; --p-pad:.08rem .55rem; --p-bg:color-mix(in srgb,var(--accent) 10%,transparent); --p-bd:color-mix(in srgb,var(--accent) 30%,transparent)}
.sec-note{font-size:var(--fs-xs); color:var(--muted); margin-left:auto; font-weight:500}
.cal-note{font-size:var(--fs-xs); color:var(--faint); margin:-.3rem 0 var(--sp-4)}

/* permalinks: anchorable section headers + deep-link target highlight */
.sec-anchor{position:absolute; left:-1.2em; top:0; font-family:var(--mono); font-weight:700; color:var(--faint); text-decoration:none; opacity:0; transition:opacity .15s var(--ease)}
.sec-head:hover .sec-anchor, .sec-anchor:focus-visible, .sec-anchor.copied{opacity:1}
.sec-anchor:hover{color:var(--accent)}
.sec-anchor.copied{color:var(--good)}
.section{scroll-margin-top:84px}
.section:target .sec-title, .section.tgt .sec-title{color:var(--accent)}

/* generic card recipe */
.prose,.ev-card,.flip-card,.why-card,.quote,.catchup,.tcard,.stat,.plat,details.triage,.about{
  background:var(--sheen); border:1px solid var(--border); border-radius:var(--r-lg);
  box-shadow:inset 0 1px 0 var(--hi), var(--shadow-1);
}
.prose{padding:1.3rem 1.4rem; font-size:var(--fs-md); line-height:1.7; color:var(--text)}
.prose p{margin-bottom:.8rem} .prose p:last-child{margin-bottom:0}
.ilink{color:var(--accent); text-decoration:none; font-family:var(--mono); font-size:.92em; font-weight:600}
.ilink:hover{text-decoration:underline}

/* ── why: what's broken vs what you'd get (bento, right) ───────────────── */
.why-grid{display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3)}
@media(max-width:680px){.why-grid{grid-template-columns:1fr}}
.why-card{padding:1.1rem 1.25rem; min-width:0; position:relative; overflow:hidden; transition:transform var(--dur-3) var(--ease-spring), box-shadow var(--dur-3) var(--ease-out-quint)}
.why-card:hover{transform:translateY(-2px); box-shadow:inset 0 1px 0 var(--hi), var(--shadow-2)}
.why-card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--wc,var(--accent)); opacity:.9}
.why-bad{--wc:var(--bad)} .why-good{--wc:var(--good)} .why-ok{--wc:var(--good)}
.why-card h3{font-size:var(--fs-sm); margin-bottom:.55rem; font-weight:700; color:var(--wc); line-height:var(--lh-ui)}
.why-sub{font-size:var(--fs-sm); color:var(--muted); margin-bottom:.6rem; line-height:1.5}
.why-card ul{list-style:none; display:flex; flex-direction:column; gap:.5rem}
.why-card li{position:relative; padding-left:1.1rem; font-size:var(--fs-base); color:var(--text); overflow-wrap:anywhere; line-height:1.5}
.why-card li::before{content:""; position:absolute; left:0; top:.55em; width:7px; height:7px; border-radius:50%; background:var(--wc)}
.why-meta{color:var(--muted); font-size:var(--fs-sm)}
.why-more{margin-top:.75rem; font-size:var(--fs-xs); color:var(--faint)}

/* ── flip conditions (what would change this verdict) ──────────────────── */
.flip-card{padding:1.15rem 1.3rem}
.flip-card ul{list-style:none; display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:.7rem 1.6rem; counter-reset:flip}
.flip-card li{position:relative; padding-left:2rem; font-size:var(--fs-base); color:var(--text); line-height:1.5; counter-increment:flip}
.flip-card li::before{content:counter(flip,decimal-leading-zero); position:absolute; left:0; top:.2em; font-family:var(--mono); font-weight:700; font-size:var(--fs-2xs); color:var(--accent); letter-spacing:.04em}
.flip-note{font-size:var(--fs-xs); color:var(--faint); margin-top:.9rem}

/* ── the full evidence, behind one toggle ──────────────────────────────── */
.details{margin-top:var(--sp-4)}
.details-toggle{
  position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:.2rem; width:100%; text-align:left;
  font:inherit; cursor:pointer; color:var(--text); transition:background var(--dur-2) var(--ease-out-quint), box-shadow var(--dur-3) var(--ease-out-quint), transform var(--dur-3) var(--ease-spring);
  padding:1.05rem 3.2rem 1.05rem 1.4rem; border-radius:var(--r-lg);
  border:1px solid transparent;
  background:linear-gradient(var(--card),var(--card)) padding-box,
             linear-gradient(120deg,color-mix(in srgb,var(--accent) 55%,transparent),var(--border2) 42%,var(--border2) 58%,color-mix(in srgb,var(--accent2) 50%,transparent)) border-box;
  box-shadow:var(--shadow-1);
}
.details-toggle:hover{background:linear-gradient(var(--card2),var(--card2)) padding-box,linear-gradient(120deg,var(--accent),var(--accent2)) border-box; box-shadow:var(--shadow-2); transform:translateY(-1px)}
.details-toggle:active{transform:scale(.995); transition-duration:var(--dur-1)}
.details-toggle .dt-main{font-family:var(--display); font-weight:700; font-size:var(--fs-md); letter-spacing:-.01em}
.details-toggle .cx{position:absolute; right:1.1rem; top:50%; width:30px; height:30px; margin-top:-15px; display:grid; place-items:center; border-radius:50%; background:var(--card3); color:var(--text); font-size:var(--fs-xs); transition:transform .2s var(--ease)}
.details-toggle[aria-expanded="true"] .cx{transform:rotate(180deg)}
.details-toggle .dt-sub{font-size:var(--fs-xs); color:var(--muted)}
.details-body[hidden]{display:none}
.details-body > .stats{margin-top:var(--sp-4); margin-bottom:0}

/* ── signal tiles (stats) ──────────────────────────────────────────────── */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:var(--sp-3); margin-bottom:var(--sp-5)}
.stat{position:relative; overflow:hidden; padding:1.1rem 1.2rem 1rem; transition:transform var(--dur-3) var(--ease-spring), box-shadow var(--dur-3) var(--ease-out-quint), border-color var(--dur-2) var(--ease-out-quint)}
.stat::before{content:""; position:absolute; inset:0 auto auto 0; width:100%; height:100%; pointer-events:none;
  background:radial-gradient(60% 55% at 0% 0%,color-mix(in srgb,var(--sc,var(--accent)) 16%,transparent),transparent 70%)}
.stat:hover{transform:translateY(-3px); border-color:var(--border2); box-shadow:inset 0 1px 0 var(--hi), var(--shadow-2)}
.stat .v .num{display:inline-block}
.stat .v .num::before{--n:var(--n-final,0); counter-reset:n var(--n); content:counter(n) var(--sfx,"")}
.stat .v{position:relative; font-family:var(--display); font-size:clamp(2rem,1.7rem + 1.2vw,2.7rem); font-weight:700; letter-spacing:-.04em; line-height:1.05; color:var(--sc,var(--text)); font-variant-numeric:tabular-nums}
.stat .l{position:relative; font-size:var(--fs-xs); color:var(--muted); margin-top:.35rem; font-weight:600}
.stat .s{position:relative; font-size:var(--fs-xs); color:var(--faint); margin-top:.1rem}

/* ── evidence ──────────────────────────────────────────────────────────── */
.ev-grid{display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3)}
@media(max-width:680px){.ev-grid{grid-template-columns:1fr}}
.ev-card{padding:1.1rem 1.25rem}
.ev-card h3{font-size:var(--fs-sm); display:flex; align-items:center; gap:.45rem; margin-bottom:.75rem; font-weight:700}
.ev-for h3{color:var(--good)} .ev-against h3{color:var(--bad)} .ev-neutral h3{color:var(--muted)}
.ev-card ul{list-style:none; display:flex; flex-direction:column; gap:.6rem; max-height:17rem; overflow-y:auto; padding-right:.4rem}
.ev-card li{position:relative; padding-left:1.15rem; font-size:var(--fs-base); color:var(--text)}
.ev-card li::before{content:""; position:absolute; left:0; top:.5em; width:7px; height:7px; border-radius:50%}
.ev-for li::before{background:var(--good)} .ev-against li::before{background:var(--bad)} .ev-neutral li::before{background:var(--gray)}
.ev-neutral{grid-column:1/-1}

/* ── sentiment ─────────────────────────────────────────────────────────── */
.quote{border-left:3px solid var(--accent); padding:1.15rem 1.3rem; font-size:var(--fs-md)}
.quote .qh{font-size:var(--fs-xs); color:var(--muted); font-weight:600; margin-bottom:.5rem}
.quote .qsrc{margin-top:.75rem; padding-top:.6rem; border-top:1px solid var(--border); font-size:var(--fs-xs); color:var(--faint)}
.prose + .quote{margin-top:var(--sp-3)}

/* ── top-level long-tail tabs (segmented control) ──────────────────────── */
.ltab-wrap{margin-top:var(--sp-6)}
.ltabs{display:inline-flex; gap:.2rem; flex-wrap:wrap; max-width:100%; padding:.25rem; background:var(--card3); border:1px solid var(--border); border-radius:var(--r-pill)}
.ltab{
  font-family:var(--display); font-size:var(--fs-sm); font-weight:650; letter-spacing:-.01em;
  color:var(--muted); background:transparent; border:0; border-radius:var(--r-pill);
  padding:.45rem 1rem; cursor:pointer; position:relative; white-space:nowrap;
  display:inline-flex; align-items:center; gap:.4rem;
  transition:color var(--dur-2) var(--ease-out-quint), background-color var(--dur-2) var(--ease-out-quint), transform var(--dur-2) var(--ease-spring);
}
.ltab:hover{color:var(--text)}
.ltab[aria-selected="true"], .ltab[aria-pressed="true"]{color:var(--text); background:var(--card); box-shadow:var(--shadow-1), inset 0 1px 0 var(--hi)}
.ki-cats{margin-bottom:.8rem}
.ki-subs{margin-top:0}
.ltab:focus-visible{outline:var(--ring-w) solid var(--ring); outline-offset:var(--ring-off)}
.ltab-panel:focus{outline:none}
.ltab-panel .section:first-child{margin-top:1.5rem}

/* ── tabs (changes) ────────────────────────────────────────────────────── */
.tabs{display:inline-flex; gap:3px; margin-bottom:1rem; flex-wrap:wrap; background:var(--card3); border:1px solid var(--border); border-radius:var(--r-pill); padding:3px}
  .tab{
  font-size:var(--fs-sm); font-weight:600; padding:.38rem .9rem; border-radius:var(--r-pill); cursor:pointer;
  background:transparent; border:0; color:var(--muted); transition:color var(--dur-2) var(--ease-out-quint), background-color var(--dur-2) var(--ease-out-quint), transform var(--dur-2) var(--ease-spring);
  display:inline-flex; align-items:center; gap:.45rem;
}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{background:var(--card); color:var(--text); box-shadow:var(--shadow-1)}
.tab .cnt{font-family:var(--mono); font-size:var(--fs-2xs); background:var(--bg-elev); padding:.05rem .45rem; border-radius:var(--r-pill); color:var(--muted)}
.change{background:transparent; border-bottom:1px solid var(--border); padding:.7rem .15rem}
.change:last-child{border-bottom:0}
.change .ct{font-weight:600; font-size:var(--fs-base)}
.change .cm{font-size:var(--fs-sm); color:var(--muted); margin-top:.25rem}
.panel{max-height:21rem; overflow-y:auto; padding-right:.3rem}
.empty{color:var(--faint); font-size:var(--fs-base); padding:.6rem 0}

/* ── impact: volume × severity meters ──────────────────────────────────── */
.impact-sub{margin-top:1.4rem}
.impact-sub:first-of-type{margin-top:.2rem}
.impact-sublabel{font-family:var(--mono); font-size:var(--fs-2xs); letter-spacing:.12em; text-transform:uppercase; color:var(--faint); font-weight:600; margin-bottom:.6rem}
.impact-note{font-size:var(--fs-xs); color:var(--muted); margin-bottom:.6rem}
.plat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:.7rem}
.plat{padding:.85rem 1rem; border-radius:var(--r-md); transition:border-color var(--dur-2) var(--ease-out-quint), transform var(--dur-3) var(--ease-spring), box-shadow var(--dur-3) var(--ease-out-quint)}
.plat:hover{border-color:var(--border2); transform:translateY(-2px); box-shadow:inset 0 1px 0 var(--hi), var(--shadow-2)}
.plat .ph{display:flex; align-items:center; gap:.4rem; min-width:0}
.plat .pn{font-weight:700; font-size:var(--fs-base); display:flex; align-items:center; gap:.45rem; min-width:0; flex:1; color:var(--text)}
.plat .pn .ic-svg{color:var(--ic)}
.plat .pname{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.plat .pmeter{display:flex; flex-direction:column; align-items:flex-start; gap:.45rem; margin-top:.75rem}
.plat .vbar{display:block; width:100%; height:6px; border-radius:var(--r-pill); background:var(--bg-elev); box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.plat .vbar .vfill{display:block; position:relative; height:100%; border-radius:var(--r-pill); background:linear-gradient(90deg,color-mix(in srgb,var(--ic) 40%,transparent),var(--ic))}
.plat .vbar .vfill::after{content:""; position:absolute; right:-2px; top:50%; width:10px; height:10px; margin-top:-5px; border-radius:50%; background:var(--ic); box-shadow:0 0 0 2px var(--card), 0 0 10px -1px var(--ic)}
.plat .pl{font-size:var(--fs-xs); font-weight:600; color:var(--ic)}
.plat.you{border-color:color-mix(in srgb,var(--accent) 45%,transparent); background:color-mix(in srgb,var(--accent) 6%,var(--card))}
.plat .me{flex:none; white-space:nowrap; font-size:var(--fs-2xs); font-weight:700; color:var(--accent)}

/* per-component verdict line — a compact table: glyph · icon · component · verdict · count */
.vline{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:0 1.2rem; border:1px solid var(--border); border-radius:var(--r-md); background:var(--card); padding:.15rem .3rem; box-shadow:inset 0 1px 0 var(--hi), var(--shadow-1)}
.vline .vchip{display:grid; grid-template-columns:1.1rem 1rem minmax(0,1fr) auto auto; align-items:center; gap:.55rem; --p-pad:.42rem .5rem; --p-bg:transparent; --p-bd:transparent; --p-fg:var(--text); --p-fw:600; --p-fs:var(--fs-sm); border-radius:var(--r-xs); border-bottom:1px solid var(--border); cursor:help}
.vline .vchip:last-child{border-bottom:0}
.vline .vchip .vc-em{font-size:var(--fs-sm); line-height:1; display:inline-flex; color:var(--good)}
.vline .vchip.hot .vc-em{color:var(--bad)}
.vline .vchip .vc-w{font-weight:500; color:var(--muted); font-size:var(--fs-xs); white-space:nowrap}
.vline .vchip.hot .vc-w{color:var(--bad)}
.vline .vchip .vc-n{font-family:var(--mono); font-size:var(--fs-2xs); background:var(--bg-elev); border-radius:var(--r-pill); padding:.05rem .45rem; color:var(--muted); min-width:1.9rem; text-align:center}
.vline-note{font-size:var(--fs-xs); color:var(--faint); margin-top:.5rem}

/* ── triage ────────────────────────────────────────────────────────────── */
details.triage{overflow:hidden}
details.triage summary{cursor:pointer; padding:.95rem 1.25rem; font-weight:700; font-size:var(--fs-md); list-style:none; display:flex; align-items:center; justify-content:space-between}
details.triage summary::-webkit-details-marker{display:none}
details.triage summary .caret{color:var(--muted); transition:.2s var(--ease); font-size:var(--fs-xs)}
details.triage[open] summary .caret{transform:rotate(90deg)}
.triage-body{padding:0 1.25rem 1.15rem; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:1.2rem}
@media(max-width:680px){.triage-body{grid-template-columns:1fr}}
.triage-col{min-width:0}
.triage-col h4{font-size:var(--fs-xs); color:var(--muted); margin:.4rem 0 .6rem; font-weight:600}
.trow{font-size:var(--fs-sm); padding:.42rem 0; border-bottom:1px solid var(--border); display:flex; gap:.5rem; align-items:baseline}
.trow:last-child{border-bottom:none}
.trow .tn{font-family:var(--mono); color:var(--accent); text-decoration:none; font-weight:600; white-space:nowrap}
.trow .tt{color:var(--text); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tscroll{max-height:260px; overflow-y:auto; padding-right:.35rem}

/* ── verdict track record ───────────────────────────────────────────────── */
.tr-sum{font-size:var(--fs-sm); color:var(--muted); margin-bottom:.9rem}
.tr-list{display:flex; flex-direction:column; gap:.45rem}
.tr-row{display:flex; align-items:center; gap:.4rem .9rem; flex-wrap:wrap; background:var(--card); border:1px solid var(--border); border-radius:var(--r-md); padding:.65rem 1rem; font-size:var(--fs-sm); transition:transform var(--dur-3) var(--ease-spring), border-color var(--dur-2) var(--ease-out-quint)}
.tr-row:hover{transform:translateY(-1px); border-color:var(--border2)}
.tr-row.cur{border-color:color-mix(in srgb,var(--accent) 45%,transparent); background:color-mix(in srgb,var(--accent) 6%,var(--card))}
.tr-ver{font-family:var(--mono); font-weight:700; min-width:8ch}
.tr-ver .cur-dot{color:var(--accent); font-size:.6rem; vertical-align:middle; margin-left:.25rem}
.tr-path{display:inline-flex; align-items:center; gap:.3rem}
.tr-path .tr-arrow{color:var(--faint); font-size:var(--fs-xs)}
.tr-runs{color:var(--muted); font-size:var(--fs-xs)}
.tr-badge{--p-fs:var(--fs-2xs); --p-fw:700; --p-pad:.12rem .55rem; --p-bg:transparent; --p-bd:var(--border2); letter-spacing:.03em}
.tr-held{--p-fg:var(--good); --p-bd:var(--good-bd); --p-bg:var(--good-bg)}
.tr-hard{--p-fg:var(--warn); --p-bd:var(--warn-bd); --p-bg:var(--warn-bg)}
.tr-soft{--p-fg:var(--bad); --p-bd:var(--bad-bd); --p-bg:var(--bad-bg)}
.tr-dates{color:var(--faint); font-size:var(--fs-xs); margin-left:auto}
.tr-note{font-size:var(--fs-xs); color:var(--faint); margin-top:.8rem}
@media(max-width:680px){ .tr-dates{margin-left:0; width:100%} }

/* ── history timeline ──────────────────────────────────────────────────── */
.timeline{display:flex; flex-direction:column; gap:0}
.tl{display:flex; gap:1rem; padding-bottom:1.1rem; position:relative}
.tl:not(:last-child)::before{content:""; position:absolute; left:13px; top:28px; bottom:0; width:1px; background:linear-gradient(var(--border2),var(--border))}
.tl .marker{width:26px; height:26px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-size:.85rem; color:var(--tone); border:1px solid var(--tone-bd); background:var(--tone-bg); box-shadow:0 0 0 4px color-mix(in srgb,var(--tone) 8%,transparent)}
.tl .tlb{flex:1; min-width:0}
.tl .tlv{font-weight:700; font-family:var(--mono); font-size:var(--fs-base)}
.tl .tlv .cur{font-size:var(--fs-2xs); font-weight:700; color:var(--accent); margin-left:.4rem; vertical-align:middle}
.tl .tlv a.snap{color:inherit; text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px; text-decoration-color:var(--tone)}
.tl .tlv a.snap:hover{text-decoration-style:solid}
.tl .tlr{font-size:var(--fs-sm); color:var(--muted); margin-top:.1rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.tl .tld{font-size:var(--fs-xs); color:var(--faint); margin-top:.1rem}

/* ── Trends: 2×2 time-series charts ──────────────────────────────────────── */
.trends-grid{display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3)}
@media(max-width:680px){.trends-grid{grid-template-columns:1fr}}
.tcard{padding:1rem 1.1rem; transition:transform var(--dur-3) var(--ease-spring), box-shadow var(--dur-3) var(--ease-out-quint)}
.tcard:hover{transform:translateY(-2px); box-shadow:inset 0 1px 0 var(--hi), var(--shadow-2)}
.tc-h{display:flex; align-items:baseline; gap:.5rem; flex-wrap:wrap; margin-bottom:.5rem}
.tc-t{font-family:var(--display); font-weight:700; font-size:var(--fs-base)}
.tc-s{font-size:var(--fs-xs); color:var(--muted)}
.tcard .chartwrap{position:relative; touch-action:pan-y}
.tcard svg.tchart2{width:100%; height:auto; display:block; overflow:visible}
.tcard .tgrid line{stroke:var(--border); stroke-width:1; stroke-dasharray:2 5; opacity:.9}
.tcard .taxis2{font-family:var(--mono); font-size:8px; fill:var(--faint)}
.tcard .tcap-bg{fill:var(--card3); stroke:var(--border2); stroke-width:.6}
.tcard .tguide{stroke:var(--faint); stroke-width:1; stroke-dasharray:3 3; display:none} .tcard .tguide.on{display:block}
.tcard .tdot{display:none; stroke:var(--card); stroke-width:1.5} .tcard .tdot.on{display:block}
.tcard .tend{stroke:var(--card); stroke-width:1.5}
.tc-legend{display:flex; flex-wrap:wrap; gap:.35rem .45rem; margin-top:.7rem; font-size:var(--fs-2xs); color:var(--muted)}
.tc-k{display:inline-flex; align-items:center; gap:.35rem; padding:.14rem .55rem; border:1px solid var(--border); border-radius:var(--r-pill); background:var(--card2); font-weight:600}
.tc-sw{width:8px; height:8px; border-radius:50%; display:inline-block; flex:none}
/* the shared hover tip: date · each series' value · version, snapped to the nearest run */
.ttip{position:absolute; top:4px; transform:translateX(10px); pointer-events:none; z-index:2; background:var(--card3); border:1px solid var(--border2); border-radius:var(--r-sm); padding:.4rem .6rem; font-size:var(--fs-2xs); color:var(--text); box-shadow:var(--shadow-2); white-space:nowrap; font-variant-numeric:tabular-nums; line-height:1.45}
.ttip.flip{transform:translateX(calc(-100% - 10px))}
.ttip .tt-h{color:var(--muted); font-weight:600; margin-bottom:.15rem}
.ttip .tt-r{display:flex; align-items:center; gap:.4rem}
.ttip .tt-r b{margin-left:auto; padding-left:.7rem; font-weight:700}
.tc-empty{color:var(--faint); font-size:var(--fs-sm); font-style:italic; padding:2.6rem 0; text-align:center}

/* ── catching up ───────────────────────────────────────────────────────── */
.catchup{padding:1.15rem 1.3rem}
.catchup .cu-row{display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; margin-bottom:.95rem}
.catchup .cu-label{font-size:var(--fs-base); color:var(--muted)}
.cu-select{font:inherit; font-size:var(--fs-base); font-weight:600; padding:.45rem .8rem; border-radius:var(--r-sm); background:var(--card3); color:var(--text); border:1px solid var(--border2); cursor:pointer}
.cu-sum{font-size:var(--fs-sm); color:var(--muted); font-weight:600; margin-bottom:.9rem}
.cu-out{max-height:24rem; overflow-y:auto; padding-right:.3rem}
.cu-rel{padding:.75rem 0; border-top:1px solid var(--border)}
.cu-rel:first-child{border-top:none; padding-top:0}
.cu-rh{display:flex; align-items:baseline; gap:.6rem; margin-bottom:.45rem}
.cu-ver{font-family:var(--mono); font-weight:700; color:var(--accent); font-size:var(--fs-base)}
.cu-date{font-size:var(--fs-xs); color:var(--faint)}
.cu-list{list-style:none; display:flex; flex-direction:column; gap:.4rem}
.cu-list li{position:relative; padding-left:1.15rem; font-size:var(--fs-base); color:var(--text)}
.cu-list li::before{content:""; position:absolute; left:0; top:.5em; width:6px; height:6px; border-radius:50%; background:var(--accent)}
.cu-list li.empty{color:var(--faint); padding-left:0}
.cu-list li.empty::before{display:none}

/* ── filters / issues ──────────────────────────────────────────────────── */
.filters{display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:1rem; align-items:center}
.fbtn{--p-bg:var(--card)}
.fsep{display:inline-flex; align-items:center; margin-right:.2rem; padding-right:.6rem; border-right:1px solid var(--border2);
  font-size:var(--fs-2xs); font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
.issue-list{display:flex; flex-direction:column; gap:.4rem}
.issue{
  background:var(--card); border:1px solid var(--border); border-left-width:3px; border-radius:var(--r-md);
  overflow:hidden; transition:border-color var(--dur-2) var(--ease-out-quint), transform var(--dur-3) var(--ease-spring); box-shadow:var(--shadow-1)}
.issue:hover{border-color:var(--border2); transform:translateX(2px)}
.issue.sev-critical{border-left-color:var(--bad); border-left-width:4px}
.issue.sev-high{border-left-color:var(--orange)}
.issue.sev-medium{border-left-color:var(--warn)}
.issue.sev-low{border-left-color:var(--gray)}
.irow{display:flex; align-items:center; gap:.6rem; width:100%; text-align:left; cursor:pointer;
  background:none; border:0; color:inherit; font:inherit; padding:.65rem .95rem}
.irow:hover{background:var(--card2)}
.irow:focus-visible{outline:var(--ring-w) solid var(--ring); outline-offset:-2px}
.sevdot{flex:none; width:9px; height:9px; border-radius:50%; background:var(--gray); box-shadow:0 0 0 3px color-mix(in srgb,var(--gray) 15%,transparent)}
.issue.sev-critical .sevdot{background:var(--bad); box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 18%,transparent)}
.issue.sev-high .sevdot{background:var(--orange); box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 18%,transparent)}
.issue.sev-medium .sevdot{background:var(--warn); box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 18%,transparent)}
.inum{flex:none; font-family:var(--mono); font-size:var(--fs-2xs); font-weight:700; color:var(--accent); background:color-mix(in srgb,var(--accent) 10%,transparent); padding:.1rem .45rem; border-radius:var(--r-pill)}
.ititle{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; font-size:var(--fs-base); color:var(--text)}
.ibs{flex:none; display:flex; align-items:center; gap:.35rem}
.ib{display:inline-flex; align-items:center; gap:.2rem; font-size:var(--fs-xs); font-weight:700; color:var(--muted)}
.chev{flex:none; color:var(--faint); font-size:var(--fs-2xs); transition:transform .15s var(--ease)}
.irow[aria-expanded="true"] .chev{transform:rotate(90deg)}
.idetail{padding:.15rem .95rem .9rem 1.5rem}
.idet-title{font-size:var(--fs-base); font-weight:600; color:var(--text); line-height:1.45; margin-bottom:.5rem; overflow-wrap:anywhere}
.idetail[hidden]{display:none}
.idet-link{display:inline-block; margin-top:.6rem; font-size:var(--fs-xs); font-weight:700; color:var(--accent); text-decoration:none}
.idet-link:hover{text-decoration:underline}
.ki-more{display:block; width:100%; margin:.6rem 0 0; font:inherit; font-size:var(--fs-sm); font-weight:600; color:var(--accent);
  background:transparent; border:1px dashed var(--border2); border-radius:var(--r-md); padding:.6rem 1.15rem; cursor:pointer; transition:.15s var(--ease)}
.ki-more:hover{background:var(--card); border-color:var(--accent)}
.issue .tags{display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.5rem}
.tag{gap:.3rem; --p-pad:.16rem .55rem}
.tag.t-bad{--p-fg:var(--bad); --p-bd:var(--bad-bd); --p-bg:var(--bad-bg)}
.tag.t-warn{--p-fg:var(--warn); --p-bd:var(--warn-bd); --p-bg:var(--warn-bg)}
.tag.t-good{--p-fg:var(--good); --p-bd:var(--good-bd); --p-bg:var(--good-bg)}
.tag.t-info{--p-fg:var(--accent); --p-bd:var(--info-bd); --p-bg:var(--info-bg)}
.tag.t-plat{--p-fg:var(--text); --p-bd:var(--border2); --p-bg:var(--card2); --p-fw:700}
.tag.t-comp{--p-fg:var(--accent2); --p-fw:700; --p-bd:color-mix(in srgb,var(--accent2) 38%,transparent); --p-bg:color-mix(in srgb,var(--accent2) 13%,transparent)}
.issue.mine{border-color:var(--info-bd); background:color-mix(in srgb,var(--info) 5%,var(--card))}
.tag.t-me{--p-fg:var(--accent); --p-bd:var(--info-bd); --p-bg:var(--info-bg)}
.tag.t-auto{--p-fg:var(--faint); border-style:dashed}
.tag.tag-raw{--p-fg:var(--muted); --p-bg:var(--card); --p-bd:var(--border); font-family:var(--mono); --p-fw:500; --p-fs:var(--fs-2xs)}

/* ── about ─────────────────────────────────────────────────────────────── */
.about{display:flex; gap:.9rem; align-items:flex-start; margin:var(--sp-5) 0 var(--sp-4); padding:1rem 1.2rem; color:var(--muted); font-size:var(--fs-sm)}
.about .ai{font-size:var(--fs-md); line-height:1.4}
.about .atxt p{margin:0; line-height:1.55}
.about .atxt b{color:var(--text)}
.about .atxt a{color:var(--accent); text-decoration:none}
.about .atxt a:hover{text-decoration:underline}
.about .atxt p.alinks{margin:.55rem 0 0; display:flex; gap:1.1rem; flex-wrap:wrap; font-weight:600}
.about .atxt{flex:1 1 auto; min-width:0}
.about-sticker{flex:0 0 auto; order:-1; align-self:center; width:96px; height:auto; margin:-.15rem .4rem -.15rem -.1rem; filter:drop-shadow(0 6px 14px rgba(0,0,0,.3))}
@media(max-width:600px){.about-sticker{width:74px}}

/* ── footer ────────────────────────────────────────────────────────────── */
.foot{margin-top:var(--sp-5); padding-top:var(--sp-4); border-top:1px solid var(--border); color:var(--muted); font-size:var(--fs-sm)}
.foot .how{display:flex; gap:.7rem; align-items:flex-start; margin-bottom:1rem}
.foot .how .fi{font-size:var(--fs-md)}
.foot .meta{display:flex; flex-wrap:wrap; gap:.4rem 1rem; font-size:var(--fs-xs); color:var(--faint)}
.foot .meta code{font-family:var(--mono); color:var(--muted)}
.foot a{color:var(--accent); text-decoration:none}
.foot a:hover{text-decoration:underline}
.foot .disclaimer{margin-top:1rem; font-size:var(--fs-xs); color:var(--faint); line-height:1.5}

.errbox{max-width:600px; margin:4rem auto; text-align:center; color:var(--muted)}
.errbox h2{color:var(--text); margin-bottom:.5rem}

/* ── a11y helpers ──────────────────────────────────────────────────────── */
.skip-link{position:absolute; left:-9999px; top:0; z-index:99; background:var(--accent); color:var(--on-accent); padding:.6rem 1.1rem; border-radius:0 0 var(--r-sm) 0; font-weight:700; text-decoration:none}
.skip-link:focus{left:0}
.vh{position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}

/* server-rendered answer: crawlable / no-JS fallback inside #app (JS replaces it on load) */
.ssr{max-width:70ch; margin:1rem auto; color:var(--text)}
.ssr h1{font-family:var(--display); font-size:clamp(1.4rem,4vw,2rem); font-weight:800; letter-spacing:-.02em; margin-bottom:.8rem}
.ssr h2{font-family:var(--display); font-size:var(--fs-md); font-weight:800; margin:1.2rem 0 .4rem}
.ssr p{margin-bottom:.7rem} .ssr ul{margin:.3rem 0 .7rem 1.2rem} .ssr li{margin-bottom:.25rem}
.ssr a{color:var(--accent)}

/* ── scrollbars / focus / motion ───────────────────────────────────────── */
::-webkit-scrollbar{width:9px; height:9px}
::-webkit-scrollbar-thumb{background:var(--border2); border-radius:var(--r-xs)}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
:focus-visible{outline:var(--ring-w) solid var(--ring); outline-offset:var(--ring-off); border-radius:4px}

/* view transitions — the long-tail tab switch goes through document.startViewTransition
   (where it exists and motion isn't reduced): a root crossfade. Nothing is named on
   purpose — naming the panels would snapshot elements thousands of pixels tall every
   frame. The evidence toggle stays a plain, synchronous reveal; its sections fade in
   through .reveal as before (see the JS). */
::view-transition-old(root){animation:vt-out var(--dur-2) var(--ease-out-quint) both}
::view-transition-new(root){animation:vt-in var(--dur-2) var(--ease-out-quint) both}
@keyframes vt-out{to{opacity:0}}
@keyframes vt-in{from{opacity:0}}

@media (prefers-reduced-motion:no-preference){
  /* meters fill once when their section reveals. Visual only: the width the
     browser tests and applyStack read lives on the INLINE style, untouched. */
  .vfill{transition:width var(--dur-3) var(--ease-out-quint) .1s}
  [data-stagger] > :not(.in) .vfill{width:0 !important}
  .idetail,.rev-detail{transition:opacity var(--dur-2) var(--ease-out-quint), translate var(--dur-2) var(--ease-out-quint)}
  /* small reveals only: the evidence body and the tab panels are thousands of px tall,
     and animating them whole promotes layers a phone can't afford — their sections
     already fade in one by one through .reveal, and the tab switch crossfades via the
     view transition. */
  .comp-chips{transition:opacity var(--dur-3) var(--ease-out-quint), translate var(--dur-3) var(--ease-out-quint)}
  @starting-style{
    .idetail:not([hidden]),.rev-detail:not([hidden]){opacity:0; translate:0 -4px}
    .comp-chips:not([hidden]){opacity:0; translate:0 8px}
  }
  /* entrance, orchestrated: eyebrow + title → the answer (a spring) → the line → the
     meta line; the setup card rises with the answer and its tiles cascade 30 ms
     apart; the bento row follows once (html.entering is on for the first second). */
  .hero-main > *{animation:rise var(--dur-3) var(--ease-out-quint) both}
  .hero-main > .hero-version{animation-delay:.04s} .hero-main > .hero-sub{animation-delay:.08s}
  .hero-main > .verdict{animation:pop .62s var(--ease-spring) .1s both}
  .hero-main > .answer-line{animation-delay:.2s}
  .hero-main > .hero-headline,.hero-main > .banner{animation-delay:.26s}
  .hero-main > .conf-row{animation-delay:.32s}
  .hero .setup{animation:rise .55s var(--ease-out-quint) .16s both}
  .setup .chips .pick{animation:rise var(--dur-3) var(--ease-out-quint) both; animation-delay:calc(.26s + var(--i,0) * 30ms)}
  .setup .comp-chips .pick{animation-delay:calc(var(--i,0) * 25ms)}
  html.entering #app > .reco.reveal,html.entering #app > #why.reveal{transition-delay:.42s}
  @keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
  @keyframes pop{from{opacity:0; transform:translateY(12px) scale(.985)} to{opacity:1; transform:none}}
  /* the stat numerals count up the first time they render (the evidence opening):
     --n is a registered <integer>, so @starting-style 0 → the final value interpolates */
  .stat .v .num::before{transition:--n .6s var(--ease-out-quint)}
  @starting-style{ .stat .v .num::before{--n:0} }
}
@media(prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important; scroll-behavior:auto !important}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none !important}
  .reveal{opacity:1; transform:none}
  [data-stagger] > *{opacity:1 !important}
}

@media(max-width:760px){

  .ltabs, .filters{display:flex; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch}
